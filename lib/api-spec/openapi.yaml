        subtotal:
          type: number
        vatPercent:
          type: number
        vatAmount:
          type: number
        total:
          type: number
        notes:
          type: ["string", "null"]
        clientName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    InvoiceInput:
      type: object
      required: [issueDate, dueDate, lineItems, subtotal, vatPercent, vatAmount, total]
      properties:
        quoteId:
          type: integer
        jobId:
          type: integer
        issueDate:
          type: string
        dueDate:
          type: string
        lineItems:
          type: array
          items:
