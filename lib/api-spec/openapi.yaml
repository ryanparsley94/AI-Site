          type: string
        subject:
          type: string
        bodyText:
          type: string

    EmailThreadUpdate:
      type: object
      properties:
        editedReply:
          type: string

    EmailInboundPayload:
      type: object
      description: >
        Resend `email.received` svix webhook envelope. The sender details and message
        body are nested under `data`; the `email_id` is used as an idempotency key.
      required: [type, data]
      properties:
        type:
          type: string
          description: Event type — only "email.received" is processed
        created_at:
          type: string
          format: date-time
        data:
          type: object
          required: [email_id, from]
          properties:
            email_id:
              type: string
              description: Resend-assigned ID used for idempotency
            from:
              type: string
              description: Sender address, "Name <email>" or bare email
            to:
              type: array
              items:
                type: string
            subject:
              type: string
            text:
              type: string
              description: Plain-text body (may be absent)
            html:
              type: string
              description: HTML body (may be absent)
            created_at:
              type: string
              format: date-time

    EmailSettings:
      type: object
      required: [autoSend, forwardingAddress, resendConfigured]
      properties:
        autoSend:
          type: boolean
        forwardingAddress:
          type: string
        resendConfigured:
          type: boolean
          description: True when RESEND_API_KEY is present and outbound delivery is active

    EmailSettingsInput:
      type: object
      properties:
        autoSend:
          type: boolean

