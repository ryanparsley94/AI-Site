openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BuildAI – Construction Company AI Assistant Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: company
    description: Company profile
  - name: assistants
    description: AI assistant configurations
  - name: calls
    description: Call logs and transcripts
  - name: jobs
    description: Job scheduling
  - name: contacts
    description: Customer and lead contacts
  - name: quotes
    description: Materials quotation, AI price search, and invoices
  - name: certificates
    description: AI-generated construction certificates and documents
  - name: dashboard
    description: Dashboard analytics and summaries
  - name: email
    description: AI email responder inbox
paths:
  /invoices/{id}/send:
    post:
      operationId: sendInvoice
      tags: [quotes]
      summary: Email a draft invoice to its uniquely resolved client contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Provider accepted invoice and status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          description: Admin session required
        "400":
          description: Client email missing or ambiguous
        "409":
          description: Already sent or send in progress
        "503":
          description: Email provider unavailable
  /voice/command:
    post:
      operationId: voiceCommand
      tags: [voice]
      summary: Execute an ephemeral contractor command or extract quote materials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transcript:
                  type: string
                  maxLength: 4000
                image:
                  type: string
                  description: JPEG, PNG or WebP data URL, maximum 5 MB
                timeZone:
                  type: string
                voice:
                  type: string
                  enum: [alloy, echo, shimmer]
      responses:
        "200":
          description: Action result and optional spoken audio, never persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceCommandResult"
        "400":
          description: Invalid command or image
        "401":
          description: Admin session required
        "429":
          description: Another command is running
        "502":
          description: AI service unavailable
  /voice/transcribe:
    post:
      operationId: voiceTranscribe
      tags: [voice]
      summary: Transcribe ephemeral recorded audio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  description: Base64 audio, maximum 10 MB
      responses:
        "200":
          description: Transcript
          content:
            application/json:
              schema:
                type: object
                required: [transcript]
                properties:
                  transcript:
                    type: string
        "401":
          description: Admin session required
        "400":
          description: Invalid audio
        "502":
          description: Transcription unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Widget ───────────────────────────────────────────────────────────────
  /widget.js:
    get:
      operationId: getWidgetScript
      tags: [widget]
      summary: Serve the embeddable chat widget JavaScript
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Self-contained widget script
          content:
            application/javascript:
              schema:
                type: string
        "404":
          description: Invalid key

  /widget/config:
    get:
      operationId: getWidgetConfig
      tags: [widget]
      summary: Fetch widget display configuration by key
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Widget configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetConfig"
        "404":
          description: Invalid key

  /widget/chat:
    post:
      operationId: widgetChat
      tags: [widget]
      summary: Send a chat message via the widget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetChatInput"
      responses:
        "200":
          description: AI reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetReply"
        "404":
          description: Invalid widget key

  /widget/slots:
    get:
      operationId: getWidgetSlots
      tags: [widget]
      summary: Return available appointment time slots for the chat booking UI
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of available slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetSlotsResponse"
        "404":
          description: Invalid widget key

  /widget/book:
    post:
      operationId: widgetBook
      tags: [widget]
      summary: Book an appointment slot and create a pending-confirmation job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetBookInput"
      responses:
        "200":
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingConfirmation"
        "403":
          description: Session not found, lead not captured, or key mismatch
        "404":
          description: Invalid widget key
        "409":
          description: Slot no longer available or already booked this session

  /company/widget-key:
    get:
      operationId: getWidgetKey
      tags: [company]
      summary: Get current widget key and customisation
      responses:
        "200":
          description: Widget key info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetKeyInfo"
    post:
      operationId: regenerateWidgetKey
      tags: [company]
      summary: Generate (or re-generate) the widget API key
      responses:
        "200":
          description: Updated widget key info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetKeyInfo"

  /company/widget-settings:
    patch:
      operationId: updateWidgetSettings
      tags: [company]
      summary: Update widget colour, greeting, etc.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetSettingsInput"
      responses:
        "200":
          description: Updated widget key info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetKeyInfo"

  # ── Company ──────────────────────────────────────────────────────────────
  /company:
    get:
      operationId: getCompany
      tags: [company]
      summary: Get company profile
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    patch:
      operationId: updateCompany
      tags: [company]
      summary: Update company profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  # ── AI Assistants ─────────────────────────────────────────────────────────
  /assistants:
    get:
      operationId: listAssistants
      tags: [assistants]
      summary: List all AI assistants
      responses:
        "200":
          description: List of assistants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assistant"
    post:
      operationId: createAssistant
      tags: [assistants]
      summary: Create a new AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantInput"
      responses:
        "201":
          description: Created assistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assistant"

  /assistants/{id}:
    get:
      operationId: getAssistant
      tags: [assistants]
      summary: Get an assistant by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Assistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assistant"
        "404":
          description: Not found
    patch:
      operationId: updateAssistant
      tags: [assistants]
      summary: Update an assistant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantUpdate"
      responses:
        "200":
          description: Updated assistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assistant"
    delete:
      operationId: deleteAssistant
      tags: [assistants]
      summary: Delete an assistant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /assistants/{id}/training:
    get:
      operationId: listAssistantTraining
      tags: [assistants]
      summary: List training entries for an assistant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Training entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssistantTraining"
        "404":
          description: Not found
    post:
      operationId: createAssistantTraining
      tags: [assistants]
      summary: Add a training entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantTrainingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantTraining"
        "404":
          description: Assistant not found

  /assistants/{id}/training/{trainingId}:
    patch:
      operationId: updateAssistantTraining
      tags: [assistants]
      summary: Update a training entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: trainingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantTrainingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantTraining"
        "404":
          description: Not found
    delete:
      operationId: deleteAssistantTraining
      tags: [assistants]
      summary: Delete a training entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: trainingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /assistants/{id}/test:
    post:
      operationId: testAssistant
      tags: [assistants]
      summary: Test the assistant with a question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestAssistantInput"
      responses:
        "200":
          description: AI answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAssistantResult"
        "404":
          description: Not found

  # ── Calls ─────────────────────────────────────────────────────────────────
  /calls:
    get:
      operationId: listCalls
      tags: [calls]
      summary: List call logs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, booked, missed, transferred, spam, unresolved]
        - name: source
          in: query
          schema:
            type: string
            enum: [all, phone, widget]
        - name: limit
          in: query
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: List of calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"

  /calls/{id}:
    get:
      operationId: getCall
      tags: [calls]
      summary: Get a call with full transcript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Call detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallDetail"
        "404":
          description: Not found
    patch:
      operationId: updateCall
      tags: [calls]
      summary: Update call notes or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallUpdate"
      responses:
        "200":
          description: Updated call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
    delete:
      operationId: deleteCall
      tags: [calls]
      summary: Delete a call record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /calls/stats:
    get:
      operationId: getCallStats
      tags: [calls]
      summary: Get call analytics (bookings, durations, outcomes)
      responses:
        "200":
          description: Call statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallStats"

  # ── Jobs ──────────────────────────────────────────────────────────────────
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List scheduled jobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending_confirmation, scheduled, in_progress, completed, cancelled]
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a new job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/upcoming:
    get:
      operationId: getUpcomingJobs
      tags: [jobs]
      summary: Get jobs scheduled in the next 7 days
      responses:
        "200":
          description: Upcoming jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ── Contacts ──────────────────────────────────────────────────────────────
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List contacts
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [all, lead, customer]
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: Not found
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Update a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Delete a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /pilot/readiness:
    get:
      operationId: getPilotReadiness
      tags: [pilot]
      summary: Honest V1 release gate; demos never count as verified live evidence
      responses:
        "200":
          description: Current pilot blockers and verification requirements
          content:
            application/json:
              schema:
                type: object
                required: [pilotName, timezone, live, checks, missingSetup]
                properties:
                  pilotName: { type: string }
                  timezone: { type: string }
                  live: { type: boolean }
                  checks:
                    type: array
                    items:
                      type: object
                      required: [id, title, status, detail, path]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        status: { type: string, enum: [blocked, not_verified, verified, failed] }
                        detail: { type: string }
                        path: { type: string }
                  missingSetup:
                    type: array
                    items: { type: string }

  # ── Quotes ───────────────────────────────────────────────────────────────
  /quotes/{id}/duplicate:
    post:
      operationId: duplicateQuote
      tags: [quotes]
      summary: Duplicate a quote as an editable draft
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "201":
          description: Draft copy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
  /quotes/{id}/convert-invoice:
    post:
      operationId: convertQuoteToInvoice
      tags: [quotes]
      summary: Convert an accepted quote, returning the existing invoice on retry
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Draft invoice with the accepted quote totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /quotes/{id}/convert-job:
    post:
      operationId: convertQuoteToJob
      tags: [quotes]
      summary: Create or return the job linked to an accepted quote
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledAt]
              properties:
                scheduledAt: { type: string, format: date-time }
      responses:
        "200":
          description: Linked job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List saved quotes
      parameters:
        - name: jobId
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Save a new quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Created quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get a quote by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Not found
    patch:
      operationId: updateQuote
      tags: [quotes]
      summary: Update a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteUpdate"
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
    delete:
      operationId: deleteQuote
      tags: [quotes]
      summary: Delete a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /invoices:
    get:
      operationId: listInvoices
      tags: [quotes]
      summary: List all invoices
      parameters:
        - name: jobId
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [quotes]
      summary: Create a new invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [quotes]
      summary: Get an invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
    patch:
      operationId: updateInvoice
      tags: [quotes]
      summary: Update an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    delete:
      operationId: deleteInvoice
      tags: [quotes]
      summary: Delete an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /quotes/price-search:
    post:
