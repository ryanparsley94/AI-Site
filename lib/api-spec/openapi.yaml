components:
  schemas:
    VoiceCommandResult:
      type: object
      required: [action, spokenResponse]
      properties:
        action:
          type: string
          enum: [none, send_invoice, complete_job, create_job, add_quote_items, schedule, outstanding_invoices, quote_draft]
        spokenResponse:
          type: string
        audio:
          type: string
          description: Base64 WAV audio
        audioError:
          type: string
        quoteDraft:
          type: array
          items:
            type: object
            required: [name, quantity, unit]
            properties:
              name:
                type: string
              quantity:
                type: number
              unit:
                type: string
        navigateTo:
          type: string
    # ── Widget ───────────────────────────────────────────────────────────────
    WidgetConfig:
      type: object
      required: [companyName, color, greeting]
      properties:
        companyName:
          type: string
        color:
          type: string
        greeting:
          type: string

    WidgetChatInput:
      type: object
      required: [key, sessionId, message]
      properties:
        key:
          type: string
        sessionId:
          type: string
        message:
          type: string
        visitorName:
          type: string
        visitorPhone:
          type: string

    WidgetReply:
      type: object
      required: [reply, sessionId]
      properties:
        reply:
          type: string
        sessionId:
          type: string
        showBooking:
          type: boolean
          description: When true the widget should display the appointment booking UI

    WidgetSlot:
      type: object
      required: [label, iso]
      properties:
        label:
          type: string
          description: Human-readable slot label e.g. "Mon, 11 Aug at 9:00 AM"
        iso:
          type: string
          description: ISO 8601 UTC datetime string for the slot

    WidgetSlotsResponse:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/WidgetSlot"

    WidgetBookInput:
      type: object
      required: [key, sessionId, slotIso]
      properties:
        key:
          type: string
        sessionId:
          type: string
        slotIso:
          type: string
          description: ISO 8601 UTC datetime of the chosen slot
        serviceDescription:
          type: string
          description: Optional description of the work the visitor needs

    BookingConfirmation:
      type: object
      required: [jobId, confirmedLabel, message]
      properties:
        jobId:
          type: number
        confirmedLabel:
          type: string
          description: Human-readable confirmation of the booked time
        message:
          type: string
          description: Confirmation message to show the visitor in the chat

    WidgetKeyInfo:
      type: object
      required: [widgetKey, color, greeting, widgetLeadNotify]
      properties:
        widgetKey:
          type: ["string", "null"]
        color:
          type: string
        greeting:
          type: string
        widgetLeadNotify:
          type: boolean

    WidgetSettingsInput:
      type: object
      properties:
        color:
          type: string
        greeting:
          type: string
        widgetLeadNotify:
          type: boolean

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Company ──────────────────────────────────────────────────────────────
    Company:
      type: object
      required: [id, name, phone, timezone, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        timezone:
          type: string
        logoUrl:
          type: ["string", "null"]
        quoteTemplate:
          type: string
          enum: [classic, modern, minimal]
        quoteAccentColor:
          type: string
        quoteTagline:
          type: ["string", "null"]
        paymentTerms:
          type: ["string", "null"]
        quoteFooterText:
          type: ["string", "null"]
        emailAutoSend:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CompanyInput:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        website:
          type: string
        address:
          type: string
        timezone:
          type: string
        logoUrl:
          type: string
        quoteTemplate:
          type: string
          enum: [classic, modern, minimal]
        quoteAccentColor:
          type: string
        quoteTagline:
          type: string
        paymentTerms:
          type: string
        quoteFooterText:
          type: string

    # ── Assistants ──────────────────────────────────────────────────────────
    Assistant:
      type: object
      required: [id, name, type, voice, personality, active, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        type:
          type: string
          enum: [phone, email, chat, marketing, scheduling]
        voice:
          type: string
          enum: [alloy, echo, fable, onyx, nova, shimmer]
        personality:
          type: string
          enum: [professional, friendly, direct]
        greeting:
          type: string
        instructions:
          type: ["string", "null"]
        active:
          type: boolean
        callsHandled:
          type: number
        jobsBooked:
          type: number
        createdAt:
          type: string
          format: date-time

    AssistantInput:
      type: object
      required: [name, type, voice, personality]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [phone, email, chat, marketing, scheduling]
        voice:
          type: string
          enum: [alloy, echo, fable, onyx, nova, shimmer]
        personality:
          type: string
          enum: [professional, friendly, direct]
        greeting:
          type: string
        instructions:
          type: string
        active:
          type: boolean

    AssistantTraining:
      type: object
      required: [id, assistantId, category, question, answer, createdAt]
      properties:
        id:
          type: number
        assistantId:
          type: number
        category:
          type: string
          enum: [service, faq, area, hours, upsell]
        question:
          type: string
        answer:
          type: string
        createdAt:
          type: string
          format: date-time

    AssistantTrainingInput:
      type: object
      required: [category, question, answer]
      properties:
        category:
          type: string
          enum: [service, faq, area, hours, upsell]
        question:
          type: string
        answer:
          type: string

    AssistantTrainingUpdate:
      type: object
      properties:
        category:
          type: string
          enum: [service, faq, area, hours, upsell]
        question:
          type: string
        answer:
          type: string

    TestAssistantInput:
      type: object
      required: [question]
      properties:
        question:
          type: string

    TestAssistantResult:
      type: object
      required: [answer]
      properties:
        answer:
          type: string

    AssistantUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [phone, email, chat, marketing, scheduling]
        voice:
          type: string
          enum: [alloy, echo, fable, onyx, nova, shimmer]
        personality:
          type: string
          enum: [professional, friendly, direct]
        greeting:
          type: string
        instructions:
          type: string
        active:
          type: boolean

    # ── Calls ────────────────────────────────────────────────────────────────
    Call:
      type: object
      required: [id, callerName, callerPhone, status, duration, outcome, assistantName, createdAt]
      properties:
        id:
          type: number
        callerName:
          type: string
        callerPhone:
          type: string
        status:
          type: string
          enum: [booked, missed, transferred, spam, unresolved]
        outcome:
          type: string
        duration:
          type: number
          description: Duration in seconds
        assistantName:
          type: string
        notes:
          type: ["string", "null"]
        jobId:
          type: ["integer", "null"]
        contactId:
          type: ["integer", "null"]
        reviewed:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CallDetail:
      type: object
      required: [id, callerName, callerPhone, status, duration, outcome, assistantName, transcript, createdAt]
      properties:
        id:
          type: number
        callerName:
          type: string
        callerPhone:
          type: string
        status:
          type: string
          enum: [booked, missed, transferred, spam, unresolved]
        outcome:
          type: string
        duration:
          type: number
        assistantName:
          type: string
        notes:
          type: ["string", "null"]
        jobId:
          type: ["integer", "null"]
        contactId:
          type: ["integer", "null"]
        reviewed:
          type: boolean
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptLine"
        createdAt:
          type: string
          format: date-time

    TranscriptLine:
      type: object
      required: [speaker, text, timestamp]
      properties:
        speaker:
          type: string
          enum: [assistant, caller]
        text:
          type: string
        timestamp:
          type: number
          description: Seconds from call start

    CallUpdate:
      type: object
      properties:
        notes:
          type: string
        reviewed:
          type: boolean
        status:
          type: string
          enum: [booked, missed, transferred, spam, unresolved]

    CallStats:
      type: object
      required: [totalCalls, bookedCalls, missedCalls, transferredCalls, averageDuration, bookingRate, callsToday, callsThisWeek]
      properties:
        totalCalls:
          type: number
        bookedCalls:
          type: number
        missedCalls:
          type: number
        transferredCalls:
          type: number
        averageDuration:
          type: number
        bookingRate:
          type: number
        callsToday:
          type: number
        callsThisWeek:
          type: number

    # ── Jobs ─────────────────────────────────────────────────────────────────
    Job:
      type: object
      required: [id, title, status, scheduledAt, contactName, contactPhone, serviceType, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending_confirmation, scheduled, in_progress, completed, cancelled]
        scheduledAt:
          type: string
          format: date-time
        estimatedDuration:
          type: ["integer", "null"]
          description: Duration in minutes
        contactName:
          type: string
        contactPhone:
          type: string
        contactId:
          type: ["integer", "null"]
        serviceType:
          type: string
        address:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        estimatedValue:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    JobInput:
      type: object
      required: [title, scheduledAt, contactName, contactPhone, serviceType]
      properties:
        title:
          type: string
        description:
          type: string
        scheduledAt:
          type: string
          format: date-time
        estimatedDuration:
          type: number
        contactName:
          type: string
        contactPhone:
          type: string
        contactId:
          type: number
        serviceType:
          type: string
        address:
          type: string
        notes:
          type: string
        estimatedValue:
          type: number
        status:
          type: string
          enum: [pending_confirmation, scheduled, in_progress, completed, cancelled]

    JobUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        scheduledAt:
          type: string
          format: date-time
        estimatedDuration:
          type: number
        contactName:
          type: string
        contactPhone:
          type: string
        serviceType:
          type: string
        address:
          type: string
        notes:
          type: string
        estimatedValue:
          type: number
        status:
          type: string
          enum: [pending_confirmation, scheduled, in_progress, completed, cancelled]
        quoteId:
          type: ["integer", "null"]
          description: Link a quote to this job; sets estimatedValue from quote's totalIncVat

    # ── Contacts ─────────────────────────────────────────────────────────────
    Contact:
      type: object
      required: [id, name, phone, type, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        type:
          type: string
          enum: [lead, customer]
        notes:
          type: ["string", "null"]
        totalJobs:
          type: number
        totalSpent:
          type: number
        createdAt:
          type: string
