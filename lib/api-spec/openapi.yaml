      properties:
        title:
          type: string
        description:
          type: string
        scheduledAt:
          type: string
          format: date-time
        estimatedDuration:
          type: number
        contactName:
          type: string
        contactPhone:
          type: string
        contactId:
          type: number
        serviceType:
          type: string
        address:
          type: string
        notes:
          type: string
        estimatedValue:
          type: number
        status:
          type: string
