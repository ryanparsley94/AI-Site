          type: boolean

    # ── Calls ────────────────────────────────────────────────────────────────
    Call:
      type: object
      required: [id, callerName, callerPhone, status, duration, outcome, assistantName, createdAt]
      properties:
        id:
          type: number
        callerName:
          type: string
        callerPhone:
          type: string
        status:
          type: string
          enum: [booked, missed, transferred, spam, unresolved]
        outcome:
          type: string
        duration:
          type: number
          description: Duration in seconds
        assistantName:
          type: string
        notes:
          type: ["string", "null"]
        jobId:
          type: ["integer", "null"]
        contactId:
          type: ["integer", "null"]
        reviewed:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CallDetail:
      type: object
      required: [id, callerName, callerPhone, status, duration, outcome, assistantName, transcript, createdAt]
      properties:
        id:
          type: number
        callerName:
          type: string
        callerPhone:
          type: string
        status:
          type: string
          enum: [booked, missed, transferred, spam, unresolved]
        outcome:
          type: string
        duration:
          type: number
        assistantName:
          type: string
        notes:
          type: ["string", "null"]
        jobId:
          type: ["integer", "null"]
        contactId:
          type: ["integer", "null"]
        reviewed:
          type: boolean
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptLine"
        createdAt:
          type: string
          format: date-time

    TranscriptLine:
      type: object
      required: [speaker, text, timestamp]
      properties:
        speaker:
          type: string
          enum: [assistant, caller]
        text:
          type: string
        timestamp:
          type: number
          description: Seconds from call start

    CallUpdate:
      type: object
      properties:
        notes:
          type: string
        reviewed:
          type: boolean
        status:
          type: string
          enum: [booked, missed, transferred, spam, unresolved]

    CallStats:
      type: object
      required: [totalCalls, bookedCalls, missedCalls, transferredCalls, averageDuration, bookingRate, callsToday, callsThisWeek]
      properties:
        totalCalls:
          type: number
        bookedCalls:
          type: number
        missedCalls:
          type: number
        transferredCalls:
          type: number
        averageDuration:
          type: number
        bookingRate:
          type: number
        callsToday:
          type: number
        callsThisWeek:
          type: number

    # ── Jobs ─────────────────────────────────────────────────────────────────
    Job:
      type: object
      required: [id, title, status, scheduledAt, contactName, contactPhone, serviceType, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending_confirmation, scheduled, in_progress, completed, cancelled]
        scheduledAt:
          type: string
          format: date-time
        estimatedDuration:
          type: ["integer", "null"]
          description: Duration in minutes
        contactName:
          type: string
        contactPhone:
          type: string
        contactId:
          type: ["integer", "null"]
        serviceType:
          type: string
        address:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        estimatedValue:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    JobInput:
      type: object
