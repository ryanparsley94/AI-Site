openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BuildAI – Construction Company AI Assistant Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: company
    description: Company profile
  - name: assistants
    description: AI assistant configurations
  - name: calls
    description: Call logs and transcripts
  - name: jobs
    description: Job scheduling
  - name: contacts
    description: Customer and lead contacts
  - name: quotes
    description: Materials quotation, AI price search, and invoices
  - name: certificates
    description: AI-generated construction certificates and documents
  - name: dashboard
    description: Dashboard analytics and summaries
  - name: email
    description: AI email responder inbox
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Widget ───────────────────────────────────────────────────────────────
  /widget.js:
    get:
      operationId: getWidgetScript
      tags: [widget]
      summary: Serve the embeddable chat widget JavaScript
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Self-contained widget script
          content:
            application/javascript:
              schema:
                type: string
        "404":
          description: Invalid key

  /widget/config:
    get:
      operationId: getWidgetConfig
      tags: [widget]
      summary: Fetch widget display configuration by key
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Widget configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetConfig"
        "404":
          description: Invalid key

  /widget/chat:
    post:
      operationId: widgetChat
      tags: [widget]
      summary: Send a chat message via the widget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetChatInput"
      responses:
        "200":
          description: AI reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetReply"
        "404":
          description: Invalid widget key

  /widget/slots:
    get:
      operationId: getWidgetSlots
      tags: [widget]
      summary: Return available appointment time slots for the chat booking UI
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of available slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetSlotsResponse"
        "404":
          description: Invalid widget key

  /widget/book:
    post:
      operationId: widgetBook
      tags: [widget]
      summary: Book an appointment slot and create a pending-confirmation job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetBookInput"
      responses:
        "200":
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingConfirmation"
        "403":
          description: Session not found, lead not captured, or key mismatch
        "404":
          description: Invalid widget key
        "409":
          description: Slot no longer available or already booked this session

  /company/widget-key:
    get:
      operationId: getWidgetKey
      tags: [company]
      summary: Get current widget key and customisation
      responses:
        "200":
          description: Widget key info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetKeyInfo"
    post:
      operationId: regenerateWidgetKey
      tags: [company]
      summary: Generate (or re-generate) the widget API key
      responses:
        "200":
          description: Updated widget key info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetKeyInfo"

  /company/widget-settings:
    patch:
      operationId: updateWidgetSettings
      tags: [company]
      summary: Update widget colour, greeting, etc.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetSettingsInput"
      responses:
        "200":
          description: Updated widget key info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetKeyInfo"

  # ── Company ──────────────────────────────────────────────────────────────
  /company:
    get:
      operationId: getCompany
      tags: [company]
      summary: Get company profile
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    patch:
      operationId: updateCompany
      tags: [company]
      summary: Update company profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  # ── AI Assistants ─────────────────────────────────────────────────────────
  /assistants:
    get:
      operationId: listAssistants
      tags: [assistants]
      summary: List all AI assistants
      responses:
        "200":
          description: List of assistants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assistant"
    post:
      operationId: createAssistant
      tags: [assistants]
      summary: Create a new AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantInput"
      responses:
        "201":
          description: Created assistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assistant"

  /assistants/{id}:
    get:
      operationId: getAssistant
      tags: [assistants]
      summary: Get an assistant by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Assistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assistant"
        "404":
          description: Not found
    patch:
      operationId: updateAssistant
      tags: [assistants]
      summary: Update an assistant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantUpdate"
      responses:
        "200":
          description: Updated assistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assistant"
    delete:
      operationId: deleteAssistant
      tags: [assistants]
      summary: Delete an assistant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /assistants/{id}/training:
    get:
      operationId: listAssistantTraining
      tags: [assistants]
      summary: List training entries for an assistant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Training entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssistantTraining"
        "404":
          description: Not found
    post:
      operationId: createAssistantTraining
      tags: [assistants]
      summary: Add a training entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantTrainingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantTraining"
        "404":
          description: Assistant not found

  /assistants/{id}/training/{trainingId}:
    patch:
      operationId: updateAssistantTraining
      tags: [assistants]
      summary: Update a training entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: trainingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantTrainingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantTraining"
        "404":
          description: Not found
    delete:
      operationId: deleteAssistantTraining
      tags: [assistants]
      summary: Delete a training entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: trainingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /assistants/{id}/test:
    post:
      operationId: testAssistant
      tags: [assistants]
      summary: Test the assistant with a question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestAssistantInput"
      responses:
        "200":
          description: AI answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAssistantResult"
        "404":
          description: Not found

  # ── Calls ─────────────────────────────────────────────────────────────────
  /calls:
    get:
      operationId: listCalls
      tags: [calls]
      summary: List call logs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, booked, missed, transferred, spam, unresolved]
        - name: source
          in: query
          schema:
            type: string
            enum: [all, phone, widget]
        - name: limit
          in: query
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: List of calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"

  /calls/{id}:
    get:
      operationId: getCall
      tags: [calls]
      summary: Get a call with full transcript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Call detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallDetail"
        "404":
          description: Not found
    patch:
      operationId: updateCall
      tags: [calls]
      summary: Update call notes or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallUpdate"
      responses:
        "200":
          description: Updated call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
    delete:
      operationId: deleteCall
      tags: [calls]
      summary: Delete a call record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /calls/stats:
    get:
      operationId: getCallStats
      tags: [calls]
      summary: Get call analytics (bookings, durations, outcomes)
      responses:
        "200":
          description: Call statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallStats"

  # ── Jobs ──────────────────────────────────────────────────────────────────
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List scheduled jobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending_confirmation, scheduled, in_progress, completed, cancelled]
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a new job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/upcoming:
    get:
      operationId: getUpcomingJobs
      tags: [jobs]
      summary: Get jobs scheduled in the next 7 days
      responses:
        "200":
          description: Upcoming jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ── Contacts ──────────────────────────────────────────────────────────────
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List contacts
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [all, lead, customer]
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: Not found
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Update a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Delete a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ── Quotes ───────────────────────────────────────────────────────────────
  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List saved quotes
      parameters:
        - name: jobId
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Save a new quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Created quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get a quote by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Not found
    patch:
      operationId: updateQuote
      tags: [quotes]
      summary: Update a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteUpdate"
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
    delete:
      operationId: deleteQuote
      tags: [quotes]
      summary: Delete a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /invoices:
    get:
      operationId: listInvoices
      tags: [quotes]
      summary: List all invoices
      parameters:
        - name: jobId
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [quotes]
      summary: Create a new invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [quotes]
      summary: Get an invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
    patch:
      operationId: updateInvoice
      tags: [quotes]
      summary: Update an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    delete:
      operationId: deleteInvoice
      tags: [quotes]
      summary: Delete an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /quotes/price-search:
    post:
      operationId: searchMaterialPrices
      tags: [quotes]
      summary: AI-powered material price search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceSearchInput"
      responses:
        "200":
          description: Price results for each material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceSearchResult"

  # ── Certificates ─────────────────────────────────────────────────────────
  /certificates:
    get:
      operationId: listCertificates
      tags: [certificates]
      summary: List saved certificates
      responses:
        "200":
          description: List of certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificate"
    post:
      operationId: createCertificate
      tags: [certificates]
      summary: Save a certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateInput"
      responses:
        "201":
          description: Created certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"

  /certificates/{id}:
    get:
      operationId: getCertificate
      tags: [certificates]
      summary: Get a certificate by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "404":
          description: Not found
    patch:
      operationId: updateCertificate
      tags: [certificates]
      summary: Update a certificate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateUpdate"
      responses:
        "200":
          description: Updated certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
    delete:
      operationId: deleteCertificate
      tags: [certificates]
      summary: Delete a certificate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /certificates/generate:
    post:
      operationId: generateCertificate
      tags: [certificates]
      summary: AI-generate a certificate document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateGenerateInput"
      responses:
        "200":
          description: Generated certificate content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateGenerateResult"

  # ── Email Inbox ──────────────────────────────────────────────────────────
  /email-threads/inbound:
    post:
      operationId: emailInbound
      tags: [email]
      summary: Resend inbound email webhook (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInboundPayload"
      responses:
        "200":
          description: Accepted

  /email-threads:
    get:
      operationId: listEmailThreads
      tags: [email]
      summary: List email threads
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, sent, dismissed]
      responses:
        "200":
          description: List of email threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailThread"

  /email-threads/{id}:
    get:
      operationId: getEmailThread
      tags: [email]
      summary: Get an email thread by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Email thread detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailThread"
        "404":
          description: Not found
    patch:
      operationId: updateEmailThread
      tags: [email]
      summary: Update the edited reply for an email thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailThreadUpdate"
      responses:
        "200":
          description: Updated email thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailThread"
        "404":
          description: Not found
    delete:
      operationId: deleteEmailThread
      tags: [email]
      summary: Delete an email thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /email-threads/{id}/approve:
    post:
      operationId: approveEmailThread
      tags: [email]
      summary: Approve and send the AI reply for an email thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Reply sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailThread"
        "404":
          description: Not found

  /email-threads/{id}/dismiss:
    post:
      operationId: dismissEmailThread
      tags: [email]
      summary: Dismiss an email thread without sending a reply
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailThread"
        "404":
          description: Not found

  /email-threads/settings:
    get:
      operationId: getEmailSettings
      tags: [email]
      summary: Get email inbox settings (auto-send, forwarding address)
      responses:
        "200":
          description: Email settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettings"
    patch:
      operationId: updateEmailSettings
      tags: [email]
      summary: Update email inbox settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettings"

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get high-level metrics for the dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

components:
  schemas:
    # ── Widget ───────────────────────────────────────────────────────────────
    WidgetConfig:
      type: object
      required: [companyName, color, greeting]
      properties:
        companyName:
          type: string
        color:
          type: string
        greeting:
          type: string

    WidgetChatInput:
      type: object
      required: [key, sessionId, message]
      properties:
        key:
          type: string
        sessionId:
          type: string
        message:
          type: string
        visitorName:
          type: string
        visitorPhone:
          type: string

    WidgetReply:
      type: object
      required: [reply, sessionId]
      properties:
        reply:
          type: string
        sessionId:
          type: string
        showBooking:
          type: boolean
          description: When true the widget should display the appointment booking UI

    WidgetSlot:
      type: object
      required: [label, iso]
      properties:
        label:
          type: string
          description: Human-readable slot label e.g. "Mon, 11 Aug at 9:00 AM"
        iso:
          type: string
          description: ISO 8601 UTC datetime string for the slot

    WidgetSlotsResponse:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/WidgetSlot"

    WidgetBookInput:
      type: object
      required: [key, sessionId, slotIso]
      properties:
        key:
          type: string
        sessionId:
          type: string
        slotIso:
          type: string
          description: ISO 8601 UTC datetime of the chosen slot
        serviceDescription:
          type: string
          description: Optional description of the work the visitor needs

    BookingConfirmation:
      type: object
      required: [jobId, confirmedLabel, message]
      properties:
        jobId:
          type: number
        confirmedLabel:
          type: string
          description: Human-readable confirmation of the booked time
        message:
          type: string
          description: Confirmation message to show the visitor in the chat

    WidgetKeyInfo:
      type: object
      required: [widgetKey, color, greeting, widgetLeadNotify]
      properties:
        widgetKey:
          type: ["string", "null"]
        color:
          type: string
        greeting:
          type: string
        widgetLeadNotify:
          type: boolean

    WidgetSettingsInput:
      type: object
      properties:
        color:
          type: string
        greeting:
          type: string
        widgetLeadNotify:
          type: boolean

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Company ──────────────────────────────────────────────────────────────
    Company:
      type: object
      required: [id, name, phone, timezone, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        timezone:
          type: string
        logoUrl:
          type: ["string", "null"]
        emailAutoSend:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CompanyInput:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        website:
          type: string
        address:
          type: string
        timezone:
          type: string
        logoUrl:
          type: string

    # ── Assistants ──────────────────────────────────────────────────────────
    Assistant:
      type: object
      required: [id, name, voice, personality, active, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        voice:
          type: string
          enum: [alloy, echo, fable, onyx, nova, shimmer]
        personality:
          type: string
          enum: [professional, friendly, direct]
        greeting:
          type: string
        instructions:
          type: ["string", "null"]
        active:
          type: boolean
        callsHandled:
          type: number
        jobsBooked:
          type: number
        createdAt:
          type: string
          format: date-time

    AssistantInput:
      type: object
      required: [name, voice, personality]
      properties:
        name:
          type: string
        voice:
          type: string
          enum: [alloy, echo, fable, onyx, nova, shimmer]
        personality:
          type: string
          enum: [professional, friendly, direct]
        greeting:
          type: string
        instructions:
          type: string
        active:
          type: boolean

    AssistantTraining:
      type: object
      required: [id, assistantId, category, question, answer, createdAt]
      properties:
        id:
          type: number
        assistantId:
          type: number
        category:
          type: string
          enum: [service, faq, area, hours, upsell]
        question:
          type: string
        answer:
          type: string
        createdAt:
          type: string
          format: date-time

    AssistantTrainingInput:
      type: object
      required: [category, question, answer]
      properties:
        category:
          type: string
          enum: [service, faq, area, hours, upsell]
        question:
          type: string
        answer:
          type: string

    AssistantTrainingUpdate:
      type: object
      properties:
        category:
          type: string
          enum: [service, faq, area, hours, upsell]
        question:
          type: string
        answer:
          type: string

    TestAssistantInput:
      type: object
      required: [question]
      properties:
        question:
          type: string

    TestAssistantResult:
      type: object
      required: [answer]
      properties:
        answer:
          type: string

    AssistantUpdate:
      type: object
      properties:
        name:
          type: string
        voice:
          type: string
          enum: [alloy, echo, fable, onyx, nova, shimmer]
        personality:
          type: string
          enum: [professional, friendly, direct]
        greeting:
          type: string
        instructions:
          type: string
