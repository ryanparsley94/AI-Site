          enum: [draft, sent, paid]
        issueDate:
          type: string
        dueDate:
          type: string
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLineItem"
        subtotal:
          type: number
        vatPercent:
          type: number
        vatAmount:
          type: number
        total:
          type: number
        notes:
          type: string
        clientName:
          type: string

    PriceSearchInput:
      type: object
      required: [materials]
      properties:
        materials:
          type: array
          items:
            type: object
            required: [name, quantity, unit]
            properties:
              name:
                type: string
              quantity:
                type: number
              unit:
                type: string

    PricedMaterial:
      type: object
      required: [name, quantity, unit, unitPrice, source, sourceUrl, total, confidence]
      properties:
        name:
          type: string
        quantity:
          type: number
        unit:
          type: string
        unitPrice:
          type: number
        source:
          type: string
        sourceUrl:
          type: string
        total:
          type: number
        confidence:
          type: string
          enum: [high, medium, low]

    PriceSearchResult:
      type: object
      required: [materials, grandTotal, disclaimer]
      properties:
        materials:
          type: array
          items:
            $ref: "#/components/schemas/PricedMaterial"
        grandTotal:
          type: number
        disclaimer:
          type: string

    # ── Certificates ─────────────────────────────────────────────────────────
    Certificate:
      type: object
      required: [id, type, title, content, createdAt]
      properties:
        id:
          type: number
        type:
          type: string
          enum: [completion, safety, warranty, lien_waiver, subcontractor_agreement]
        title:
          type: string
        content:
          type: string
        jobId:
          type: ["string", "null"]
        jobTitle:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CertificateInput:
      type: object
      required: [type, title, content]
      properties:
        type:
          type: string
          enum: [completion, safety, warranty, lien_waiver, subcontractor_agreement]
        title:
          type: string
        content:
          type: string
        jobId:
          type: string
        jobTitle:
          type: string

    CertificateUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        jobId:
          type: string
        jobTitle:
          type: string

    CertificateGenerateInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [completion, safety, warranty, lien_waiver, subcontractor_agreement]
        jobId:
          type: string
        jobTitle:
          type: string
        jobDescription:
          type: string
        jobAddress:
          type: string
        contactName:
          type: string
        completionDate:
          type: string
        customInstructions:
          type: string

    CertificateGenerateResult:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string

    # ── Email Inbox ──────────────────────────────────────────────────────────
    EmailThread:
      type: object
      required: [id, fromEmail, fromName, subject, bodyText, status, createdAt]
      properties:
        id:
          type: number
        fromEmail:
          type: string
        fromName:
          type: string
        subject:
          type: string
        bodyText:
          type: string
        bodyHtml:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, sent, dismissed]
        aiReply:
          type: ["string", "null"]
        editedReply:
          type: ["string", "null"]
        contactId:
          type: ["integer", "null"]
        messageId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    EmailThreadUpdate:
      type: object
      properties:
        editedReply:
          type: string

    EmailInboundPayload:
      type: object
      description: >
        Resend `email.received` svix webhook envelope. The sender details and message
        body are nested under `data`; the `email_id` is used as an idempotency key.
      required: [type, data]
      properties:
        type:
          type: string
          description: Event type — only "email.received" is processed
        created_at:
          type: string
          format: date-time
        data:
          type: object
          required: [email_id, from]
          properties:
            email_id:
              type: string
              description: Resend-assigned ID used for idempotency
            from:
              type: string
              description: Sender address, "Name <email>" or bare email
            to:
              type: array
              items:
                type: string
            subject:
              type: string
            text:
              type: string
              description: Plain-text body (may be absent)
            html:
              type: string
              description: HTML body (may be absent)
            created_at:
              type: string
              format: date-time

    EmailSettings:
      type: object
      required: [autoSend, forwardingAddress]
      properties:
        autoSend:
          type: boolean
        forwardingAddress:
          type: string

    EmailSettingsInput:
      type: object
      properties:
        autoSend:
          type: boolean

    # ── Dashboard ─────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [callsToday, jobsThisWeek, activeAssistants, newLeadsThisWeek, bookingRate, revenueThisMonth, upcomingJobsCount, missedCallsToday]
      properties:
        callsToday:
          type: number
        jobsThisWeek:
          type: number
        activeAssistants:
          type: number
        newLeadsThisWeek:
          type: number
        bookingRate:
          type: number
        revenueThisMonth:
          type: number
        upcomingJobsCount:
          type: number
        missedCallsToday:
          type: number
