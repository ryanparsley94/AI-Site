        jobId:
          type: ["integer", "null"]
        marginPercent:
          type: ["number", "null"]
        vatPercent:
          type: ["number", "null"]
        marginAmount:
          type: ["number", "null"]
        vatAmount:
          type: ["number", "null"]
        totalIncVat:
          type: ["number", "null"]
        createdAt:
