        vatAmount:
          type: ["number", "null"]
        totalIncVat:
          type: ["number", "null"]

    QuoteWorkflow:
      type: object
      required: [customerName, customerEmail, customerPhone, billingAddress, siteAddress, scope, assumptions, exclusions, paymentTerms, validUntil, vatRegistered, vatNumber, vatPercent, deposit, sections]
      properties:
        customerName: { type: string, maxLength: 300 }
        customerEmail: { type: string, maxLength: 300 }
        customerPhone: { type: string, maxLength: 100 }
        billingAddress: { type: string, maxLength: 2000 }
        siteAddress: { type: string, maxLength: 2000 }
        scope: { type: string, maxLength: 20000 }
        assumptions: { type: string, maxLength: 10000 }
        exclusions: { type: string, maxLength: 10000 }
        paymentTerms: { type: string, maxLength: 10000 }
        validUntil: { type: string }
        vatRegistered: { type: boolean }
        vatNumber: { type: string }
        vatPercent: { type: number, minimum: 0, maximum: 100 }
        deposit:
          type: object
          required: [mode, value]
          properties:
            mode: { type: string, enum: [none, materials, fixed, percentage] }
            value: { type: number, minimum: 0 }
        sections:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, title, items]
            properties:
              id: { type: string }
              title: { type: string, maxLength: 300 }
              items:
                type: array
                maxItems: 500
                items:
                  $ref: "#/components/schemas/QuoteWorkflowItem"
