      type: object
      required: [id, name, phone, type, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        type:
          type: string
          enum: [lead, customer]
        notes:
          type: ["string", "null"]
        totalJobs:
          type: number
        totalSpent:
          type: number
        createdAt:
          type: string
          format: date-time

    ContactInput:
      type: object
      required: [name, phone, type]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        type:
          type: string
          enum: [lead, customer]
        notes:
          type: string

    ContactUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        type:
          type: string
          enum: [lead, customer]
        notes:
          type: string

    # ── Quotes ───────────────────────────────────────────────────────────────
    MaterialLineItem:
      type: object
      required: [name, quantity, unit]
      properties:
        name:
          type: string
        quantity:
          type: number
        unit:
          type: string
        unitPrice:
          type: ["number", "null"]
        source:
          type: ["string", "null"]
        sourceUrl:
          type: ["string", "null"]
        total:
          type: ["number", "null"]

    Quote:
      type: object
      required: [id, title, materials, grandTotal, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        materials:
          type: array
          items:
            $ref: "#/components/schemas/MaterialLineItem"
        grandTotal:
          type: number
        jobId:
          type: ["integer", "null"]
        marginPercent:
          type: ["number", "null"]
        vatPercent:
          type: ["number", "null"]
        marginAmount:
          type: ["number", "null"]
        vatAmount:
          type: ["number", "null"]
        totalIncVat:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    QuoteInput:
      type: object
      required: [title, materials]
      properties:
        title:
          type: string
        materials:
          type: array
          items:
            $ref: "#/components/schemas/MaterialLineItem"
        grandTotal:
          type: number
        jobId:
          type: integer
        marginPercent:
          type: number
        vatPercent:
          type: number
        marginAmount:
          type: number
        vatAmount:
          type: number
        totalIncVat:
          type: number

    QuoteUpdate:
      type: object
      properties:
        title:
          type: string
        materials:
          type: array
          items:
            $ref: "#/components/schemas/MaterialLineItem"
        grandTotal:
          type: number
        jobId:
          type: ["integer", "null"]
        marginPercent:
          type: ["number", "null"]
        vatPercent:
          type: ["number", "null"]
        marginAmount:
          type: ["number", "null"]
        vatAmount:
          type: ["number", "null"]
        totalIncVat:
          type: ["number", "null"]

    InvoiceLineItem:
      type: object
      required: [name, quantity, unit, unitPrice, total]
      properties:
        name:
          type: string
        quantity:
          type: number
        unit:
          type: string
        unitPrice:
          type: number
        total:
          type: number

    Invoice:
      type: object
      required: [id, invoiceNumber, status, issueDate, dueDate, lineItems, subtotal, vatPercent, vatAmount, total, createdAt]
      properties:
        id:
          type: number
        invoiceNumber:
          type: string
        quoteId:
          type: ["integer", "null"]
        jobId:
          type: ["integer", "null"]
        status:
          type: string
