          type: string
        description:
          type: string
        scheduledAt:
          type: string
          format: date-time
        estimatedDuration:
          type: number
        contactName:
          type: string
        contactPhone:
          type: string
        serviceType:
          type: string
        address:
          type: string
        notes:
          type: string
        estimatedValue:
          type: number
        status:
          type: string
          enum: [pending_confirmation, scheduled, in_progress, completed, cancelled]
        quoteId:
          type: ["integer", "null"]
          description: Link a quote to this job; sets estimatedValue from quote's totalIncVat

    # ── Contacts ─────────────────────────────────────────────────────────────
