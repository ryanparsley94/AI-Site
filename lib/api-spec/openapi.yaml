      properties:
        id: { type: string }
        type: { type: string, enum: [materials, labour, subcontractor, plant, other] }
        description: { type: string, maxLength: 2000 }
        quantity: { type: number, minimum: 0, maximum: 1000000 }
        unit: { type: string, maxLength: 100 }
        costPrice: { type: number, minimum: 0, maximum: 10000000 }
        sellPrice: { type: number, minimum: 0, maximum: 10000000 }
        source: { type: string }
        sourceUrl: { type: string }
        pricedAt: { type: string }
        priceVerified: { type: boolean }

