        callId: { type: ["integer", "null"] }
        status: { type: string, enum: [draft, reviewed, accepted] }
        revision: { type: integer, description: Expected current revision for optimistic concurrency }
        workflow: { $ref: "#/components/schemas/QuoteWorkflow" }
        title:
          type: string
        materials:
          type: array
          items:
            $ref: "#/components/schemas/MaterialLineItem"
        grandTotal:
          type: number
        jobId:
          type: ["integer", "null"]
        marginPercent:
          type: ["number", "null"]
        vatPercent:
